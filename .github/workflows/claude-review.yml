name: Claude PR Review

on:
  workflow_call:
    inputs:
      additional_prompt:
        description: Extra instructions appended to the default review prompt.
        required: false
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true
          include_fix_links: false
          claude_args: >
            --model opus
            --effort xhigh
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
          prompt: |
            Do a detailed code review of this pull request following these guidelines.

            ### Bug-flagging criteria

            - It meaningfully impacts the accuracy, performance, security, or maintainability of the code.
            - The bug is discrete and actionable (i.e. not a general issue with the codebase or a combination of multiple issues).
            - The bug was introduced in the commit (pre-existing bugs should not be flagged).
            - The author of the original PR would likely fix the issue if they were made aware of it.
            - It is not enough to speculate that a change may disrupt another part of the codebase, to be considered a bug,
              one must identify the other parts of the code that are provably affected.
            - The bug is clearly not just an intentional change by the original author.

            ### Detailed finding quality

            - The finding should be clear about why the issue is a bug.
            - The finding should appropriately communicate the severity of the issue. It should not claim that an issue is
              more severe than it actually is.
            - The finding should be brief. The body should be at most 1 paragraph. It should not introduce line breaks
              within the natural language flow unless it is necessary for the code fragment.
            - The finding should clearly and explicitly communicate the scenarios, environments, or inputs that are
              necessary for the bug to arise. The finding should immediately indicate that the issue's severity depends
              on these factors.
            - The finding should be written such that the original author can immediately grasp the idea without close
              reading.
            - A short fenced code block is welcome wherever it adds useful context — for example to
              illustrate a suggested fix or the corrected lines. Keep it to the minimum relevant lines,
              and use a plain code fence (not a ```suggestion block, which is inert outside inline reviews).

            ### Severity prefixes

            Findings that pass the bug-flagging criteria above are unprefixed; weaker concerns are `Minor:` or
            `Nit:`.

            - `Nit:` — subjective / personal preference; use sparingly.
            - `Minor:` — real concern but not a bug or behavior change. CLAUDE.md convention violations typically
              fall into this category.
            - No prefix — findings that meet the bug-flagging criteria above.

            Skip formatting and style findings entirely — pre-commit handles those.

            ## Organize the review under these sections:

            - `Summary`
              - A high-level take plus any cross-cutting concerns. One paragraph maximum.
            - `Details`
              - One finding per h4 #### heading, ordered by severity, most severe first.
              - The first line of each heading is the severity prefix in bold — only if the
                finding has one (see Severity prefixes) — followed by the backticked
                location. The explanation and a commit permalink to the line each go on
                their own line indented beneath. Use `path/to/file.ext:LINE` with `#L<LINE>`
                for a single line, or `path/to/file.ext:START-END` with `#L<START>-L<END>`
                for a range (keep the `L` on both ends, e.g. `#L54-L76`); either form is
                valid whether the lines were added, changed, or removed.
              - Anchor the permalink to the commit where the cited lines actually exist:
                - For lines the PR adds, changes, or leaves in place (present at head), use
                  `${{ github.event.pull_request.head.sha }}` with the new line numbers.
                - For lines the PR deletes (absent at head), use
                  `${{ github.event.pull_request.base.sha }}` with the original pre-change
                  line numbers taken from `gh pr diff` — they are gone from the checked-out
                  tree, so do not read them from the working files. Append ` (removed)` to
                  the location of a deletion finding so it is clear the line numbers refer
                  to the pre-change file; leave additions and changes unmarked.

                #### `path/to/file.ext:LINE`
                A short paragraph explaining a finding about an added or changed line.
                https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}/path/to/file.ext#L<LINE>

                #### **<Severity>**: `path/to/file.ext:START-END` (removed)
                A short paragraph explaining a finding about lines the PR deletes.
                https://github.com/${{ github.repository }}/blob/${{ github.event.pull_request.base.sha }}/path/to/file.ext#L<START>-L<END>

            Omit any sections that are empty.

            ${{ inputs.additional_prompt }}
